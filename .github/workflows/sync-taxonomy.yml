name: Sync taxonomy

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'

concurrency:
  group: sync-taxonomy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run taxonomy sync
        run: node scripts/sync-taxonomy.mjs

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Sync theme.config.ts taxonomy
          file_pattern: src/config/theme.config.ts