name: Sync taxonomy

on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"

concurrency:
  group: sync-taxonomy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      # Node.js's version comes from "engines" in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run taxonomy sync
        run: node scripts/sync-taxonomy.mjs

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Sync theme.config.ts taxonomy
          file_pattern: src/config/theme.config.ts
