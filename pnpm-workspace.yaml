# Settings for pnpm, the package manager.

# Write exact version numbers into package.json (7.4.11, not ^7.4.11), so every install is the same.
saveExact: true

# pnpm runs no package's install script unless it is named here under "allowBuilds", and stops
# if a package asks to run one. None of this blog's packages needs one.

# Vite+ (formatting, linting, tests) brings its own build of Vite; Astro keeps its own Vite for
# building the blog. Vitest asks for a Vite version and would warn about the mix; this tells pnpm
# that is fine.
peerDependencyRules:
  allowAny:
    - vite

# Security fix: minimatch before 11.0.1 can be slowed to a halt by some patterns (GHSA-g3hv-75wg-m249).
# Keystatic still asks for minimatch 10, which has no fix, and uses only its "filter", which works
# the same in 11. Remove this once Keystatic asks for minimatch 11 or newer.
overrides:
  "@keystatic/core>minimatch": 11.0.8
